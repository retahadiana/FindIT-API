basePath: /api/v1
definitions:
  model.AddReputationRequest:
    properties:
      claim_id:
        minimum: 1
        type: integer
      feedback:
        $ref: '#/definitions/model.Feedback'
      item_id:
        minimum: 1
        type: integer
      points:
        maximum: 100
        minimum: 1
        type: integer
      reason:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - claim_id
    - item_id
    - points
    - reason
    type: object
  model.AssignRoleRequest:
    properties:
      role:
        enum:
        - admin
        - staff
        - user
        type: string
    required:
    - role
    type: object
  model.Category:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  model.Claim:
    properties:
      claimant_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      item_id:
        type: integer
      proof_description:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  model.CreateCategoryRequest:
    properties:
      description:
        maxLength: 300
        type: string
      name:
        maxLength: 80
        minLength: 2
        type: string
    required:
    - name
    type: object
  model.CreateClaimRequest:
    properties:
      proof_description:
        maxLength: 2000
        minLength: 10
        type: string
    required:
    - proof_description
    type: object
  model.CreateItemRequest:
    properties:
      category_id:
        minimum: 1
        type: integer
      description:
        maxLength: 2000
        minLength: 10
        type: string
      event_date:
        type: string
      item_type:
        enum:
        - lost
        - found
        type: string
      location:
        maxLength: 150
        minLength: 3
        type: string
      title:
        maxLength: 150
        minLength: 3
        type: string
    required:
    - category_id
    - description
    - event_date
    - item_type
    - location
    - title
    type: object
  model.CreateUserRequest:
    properties:
      email:
        maxLength: 120
        type: string
      full_name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 72
        type: string
      phone:
        maxLength: 20
        minLength: 8
        type: string
      role:
        enum:
        - admin
        - staff
        - user
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - full_name
    - password
    - username
    type: object
  model.ErrorResponse:
    properties:
      code:
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
      request_id:
        type: string
      success:
        type: boolean
    type: object
  model.Feedback:
    properties:
      comment:
        maxLength: 500
        type: string
      from_user_id:
        type: integer
      rating:
        maximum: 5
        minimum: 1
        type: integer
    required:
    - rating
    type: object
  model.Item:
    properties:
      category_id:
        type: integer
      category_name:
        type: string
      created_at:
        type: string
      description:
        type: string
      event_date:
        type: string
      id:
        type: integer
      item_type:
        type: string
      location:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
      version:
        type: integer
    type: object
  model.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  model.Notification:
    properties:
      body:
        type: string
      channel:
        type: string
      id:
        type: integer
      outbox_id:
        type: integer
      sent_at:
        type: string
      subject:
        type: string
      user_id:
        type: integer
    type: object
  model.OutboxStats:
    properties:
      pending:
        type: integer
      published:
        type: integer
    type: object
  model.PatchUserRequest:
    properties:
      full_name:
        maxLength: 100
        minLength: 2
        type: string
      phone:
        maxLength: 20
        minLength: 8
        type: string
    type: object
  model.QuestionAnswer:
    properties:
      answer:
        maxLength: 500
        type: string
      is_matched:
        type: boolean
      question:
        maxLength: 300
        minLength: 3
        type: string
    required:
    - question
    type: object
  model.QueueMonitorResponse:
    properties:
      notifications_sent:
        type: integer
      outbox:
        $ref: '#/definitions/model.OutboxStats'
      queues:
        items:
          $ref: '#/definitions/model.QueueStats'
        type: array
    type: object
  model.QueueStats:
    properties:
      active:
        type: integer
      archived:
        type: integer
      pending:
        type: integer
      queue:
        type: string
      retry:
        type: integer
      scheduled:
        type: integer
    type: object
  model.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  model.RegisterRequest:
    properties:
      email:
        maxLength: 120
        type: string
      full_name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 72
        type: string
      phone:
        maxLength: 20
        minLength: 8
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - full_name
    - password
    - username
    type: object
  model.ReplaceUserRequest:
    properties:
      email:
        maxLength: 120
        type: string
      full_name:
        maxLength: 100
        minLength: 2
        type: string
      phone:
        maxLength: 20
        minLength: 8
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - full_name
    - username
    type: object
  model.ReputationLog:
    properties:
      claim_id:
        type: integer
      created_at:
        type: string
      feedback:
        $ref: '#/definitions/model.Feedback'
      id:
        type: string
      item_id:
        type: integer
      points:
        type: integer
      reason:
        type: string
      user_id:
        type: integer
    type: object
  model.ReputationSummary:
    properties:
      avg_rating:
        type: number
      count:
        type: integer
      distribution:
        additionalProperties:
          type: integer
        type: object
      total_points:
        type: integer
      user_id:
        type: integer
    type: object
  model.ReviewVerificationRequest:
    properties:
      confidential_notes:
        maxLength: 500
        type: string
      is_verified:
        type: boolean
    type: object
  model.SubmitQARequest:
    properties:
      questions:
        items:
          $ref: '#/definitions/model.QuestionAnswer'
        maxItems: 10
        minItems: 1
        type: array
    required:
    - questions
    type: object
  model.TokenPair:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  model.UpdateClaimStatusRequest:
    properties:
      status:
        enum:
        - approved
        - rejected
        - cancelled
        type: string
    required:
    - status
    type: object
  model.UpdateItemRequest:
    properties:
      category_id:
        minimum: 1
        type: integer
      description:
        maxLength: 2000
        minLength: 10
        type: string
      location:
        maxLength: 150
        minLength: 3
        type: string
      status:
        enum:
        - open
        - claimed
        - returned
        - closed
        type: string
      title:
        maxLength: 150
        minLength: 3
        type: string
    required:
    - category_id
    - description
    - location
    - status
    - title
    type: object
  model.UpdateUserRequest:
    properties:
      full_name:
        maxLength: 100
        minLength: 2
        type: string
      phone:
        maxLength: 20
        minLength: 8
        type: string
    required:
    - full_name
    type: object
  model.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      phone:
        type: string
      role:
        type: string
      trust_score:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  model.UserProfile:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      permissions:
        items:
          type: string
        type: array
      phone:
        type: string
      role:
        type: string
      trust_score:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  model.UserReputationResponse:
    properties:
      badge:
        type: string
      history:
        items:
          $ref: '#/definitions/model.ReputationLog'
        type: array
      score:
        type: integer
      total_found:
        type: integer
      user:
        $ref: '#/definitions/model.User'
    type: object
  model.VerificationSession:
    properties:
      claim_id:
        type: integer
      claimant_id:
        type: integer
      confidential_notes:
        type: string
      created_at:
        type: string
      finder_id:
        type: integer
      id:
        type: string
      is_verified:
        type: boolean
      item_id:
        type: integer
      questions:
        items:
          $ref: '#/definitions/model.QuestionAnswer'
        type: array
      updated_at:
        type: string
    type: object
  model.WebResponse:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      meta: {}
      success:
        type: boolean
    type: object
info:
  contact: {}
  description: API Lost and Found Kampus untuk pelaporan dan pencarian barang hilang/temuan,
    verifikasi klaim, reputasi, dan notifikasi outbox.
  title: FindIt API - Lost & Found Kampus
  version: "1.0"
paths:
  /admin/queue:
    get:
      description: Memantau statistik antrian Redis Asynq dan baris unpublished tabel
        outbox PostgreSQL.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.QueueMonitorResponse'
              type: object
        "401":
          description: Belum terautentikasi
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Tidak memiliki izin queue:monitor
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Monitor status antrian Asynq dan transactional outbox
      tags:
      - notifications
  /auth/login:
    post:
      consumes:
      - application/json
      description: Masuk dengan username dan password untuk memperoleh Access Token
        dan Refresh Token.
      parameters:
      - description: Kredensial login
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.TokenPair'
              type: object
        "400":
          description: Body bukan JSON valid
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Username atau password salah
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Validasi gagal
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Login dan mendapatkan token
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Mencabut refresh token aktif dari database.
      parameters:
      - description: Refresh token yang akan dicabut
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.WebResponse'
        "400":
          description: Body bukan JSON valid
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Logout sesi pengguna
      tags:
      - auth
  /auth/me:
    get:
      description: Mengambil detail profil dan daftar permission pengguna yang sedang
        login.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.UserProfile'
              type: object
        "401":
          description: Belum terautentikasi
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Profil pengguna aktif
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Menukar refresh token valid dengan pasangan access token dan refresh
        token baru (token rotation).
      parameters:
      - description: Refresh token saat ini
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.TokenPair'
              type: object
        "400":
          description: Body bukan JSON valid
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Refresh token tidak valid atau kedaluwarsa
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Validasi gagal
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Memperbarui access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Mendaftarkan pengguna mahasiswa baru dengan role default user dan
        trust score 100.
      parameters:
      - description: Data pendaftaran pengguna
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.User'
              type: object
        "400":
          description: Body bukan JSON valid
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Username atau email sudah digunakan
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Validasi gagal
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Mendaftarkan akun baru
      tags:
      - auth
  /categories:
    get:
      description: Mengambil semua daftar kategori barang yang tersedia.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Category'
                  type: array
              type: object
        "500":
          description: Terjadi kesalahan internal server
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Daftar seluruh kategori barang
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Membuat kategori barang baru di database. Memerlukan permission
        category:manage.
      parameters:
      - description: Data kategori baru
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.Category'
              type: object
        "400":
          description: Body bukan JSON valid
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Belum terautentikasi
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Tidak memiliki izin category:manage
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Nama kategori sudah ada
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Validasi gagal
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Buat kategori baru (Admin)
      tags:
      - categories
  /claims/{id}:
    get:
      description: Mengambil rincian informasi klaim barang.
      parameters:
      - description: ID Klaim
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.Claim'
              type: object
        "400":
          description: ID klaim tidak valid
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Belum terautentikasi
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Klaim tidak ditemukan
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Detail klaim berdasarkan ID
      tags:
      - claims
  /claims/{id}/status:
    patch:
      consumes:
      - application/json
      description: Mengubah status pengajuan klaim. Jika approved, status barang diubah
        menjadi returned menggunakan Optimistic Concurrency Control (OCC) dan memicu
        event outbox.
      parameters:
      - description: ID Klaim
        in: path
        name: id
        required: true
        type: integer
      - description: Status baru (approved, rejected, cancelled)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.UpdateClaimStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.Claim'
              type: object
        "400":
          description: ID atau payload tidak valid
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Belum terautentikasi
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Tidak memiliki hak memproses klaim
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Klaim atau barang tidak ditemukan
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Klaim sudah diproses atau terjadi konflik OCC versi barang
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Ubah status klaim (Approved / Rejected / Cancelled) dengan OCC
      tags:
      - claims
  /claims/{id}/verification:
    get:
      description: Mengambil data sesi tanya-jawab ciri khusus barang dari MongoDB
        berdasarkan ID klaim.
      parameters:
      - description: ID Klaim
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.VerificationSession'
              type: object
        "400":
          description: ID klaim tidak valid
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Sesi verifikasi tidak ditemukan
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Ambil sesi verifikasi tanya-jawab ciri khusus
      tags:
      - verifications
    post:
      consumes:
      - application/json
      description: Penemu barang membuat daftar pertanyaan ciri khusus rahasia (maksimal
        10 pertanyaan disimpan di MongoDB) untuk dijawab oleh pengklaim.
      parameters:
      - description: ID Klaim
        in: path
        name: id
        required: true
        type: integer
      - description: Daftar pertanyaan verifikasi
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.SubmitQARequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.VerificationSession'
              type: object
        "400":
          description: ID klaim atau payload tidak valid
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Belum terautentikasi
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Hanya penemu barang yang berhak membuat sesi
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Klaim tidak ditemukan
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Sesi verifikasi untuk klaim ini sudah ada atau klaim bukan
            pending
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Buat sesi pertanyaan verifikasi rahasia (Penemu)
      tags:
      - verifications
  /claims/{id}/verification/answers:
    put:
      consumes:
      - application/json
      description: Pengklaim menjawab pertanyaan-pertanyaan ciri khusus yang diajukan
        oleh penemu.
      parameters:
      - description: ID Klaim
        in: path
        name: id
        required: true
        type: integer
      - description: Jawaban atas pertanyaan verifikasi
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.SubmitQARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.VerificationSession'
              type: object
        "400":
          description: ID klaim atau payload tidak valid
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Belum terautentikasi
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Hanya pengklaim yang berhak menjawab pertanyaan
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Sesi verifikasi tidak ditemukan
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Jawab pertanyaan verifikasi (Pengklaim)
      tags:
      - verifications
  /claims/{id}/verification/review:
    post:
      consumes:
      - application/json
      description: Penemu atau admin menilai kebenaran jawaban pengklaim (is_verified)
